name: Bug report
description: Something in NativePi does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here. Use
        [private vulnerability reporting](https://github.com/nonlooped/nativepi/security/advisories/new)
        instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project
        2. Start a conversation
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: NativePi version
      description: Shown in the app, or the version of the installer you ran.
      placeholder: 0.8.1
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Provider and model
      description: If the problem involves a specific model, name it.
      placeholder: anthropic / claude-opus-5

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any relevant error output. Remove anything sensitive.
      render: text
