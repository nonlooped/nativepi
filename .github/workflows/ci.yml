name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for a release
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Reusable release checks must not cancel ordinary CI or their caller.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    # Keep this check name stable for branch protection; never skip the job itself.
    name: Typecheck, Test & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Select checks
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Setup
        if: steps.scope.outputs.core == 'true' || steps.scope.outputs.web == 'true'
        uses: ./.github/actions/setup
        with:
          bun-cache: "true"

      - name: Typecheck desktop and packages
        if: steps.scope.outputs.core == 'true'
        run: bun run --filter '@nativepi/desktop' --filter './packages/*' typecheck

      - name: Check website
        if: steps.scope.outputs.web == 'true'
        run: |
          bun run --cwd apps/web typecheck
          bun run --cwd apps/web lint

      - name: Test desktop
        if: steps.scope.outputs.core == 'true'
        run: |
          bun test apps/desktop
          bun run --cwd apps/desktop test:dom

      - name: Test packages and integration
        if: steps.scope.outputs.core == 'true' || steps.scope.outputs.web == 'true'
        # Integration tests compile website examples against desktop and package dependencies.
        run: bun test packages tests

      - name: Build desktop
        if: steps.scope.outputs.core == 'true'
        run: bun run --cwd apps/desktop build

      - name: Cache Next.js build
        if: steps.scope.outputs.web == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-next-${{ hashFiles('bun.lock', 'apps/web/next.config.*') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-next-${{ hashFiles('bun.lock', 'apps/web/next.config.*') }}-

      - name: Build website
        if: steps.scope.outputs.web == 'true'
        run: bun run --cwd apps/web build
