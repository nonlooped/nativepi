name: Publish extension packages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  verify-main:
    name: Verify main and plan packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      api: ${{ steps.plan.outputs.api }}
      extensions: ${{ steps.plan.outputs.extensions }}
    steps:
      # This step runs before any candidate code is checked out.
      - name: Verify successful main push CI
        id: verify
        uses: actions/github-script@v8
        with:
          script: |
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (repository !== 'nonlooped/nativepi') throw new Error('Publication is restricted to nonlooped/nativepi');
            const trustedRun = (run, sha) =>
              run.head_sha === sha && run.head_branch === 'main' &&
              run.event === 'push' && run.conclusion === 'success' &&
              run.head_repository?.full_name === repository &&
              run.repository?.full_name === repository;
            let sha;
            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              sha = run?.head_sha;
              if (!trustedRun(run, sha)) throw new Error('CI did not certify a push to this repository main');
            } else if (context.eventName === 'workflow_dispatch' && context.ref === 'refs/heads/main') {
              const ref = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
              sha = ref.data.object.sha;
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', status: 'success', per_page: 100,
              });
              if (!runs.some((run) => trustedRun(run, sha))) throw new Error('Main has no successful push CI verdict');
            } else throw new Error('Publication requires a main dispatch or successful main push CI');
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid certified commit SHA');
            core.setOutput('sha', sha);

      - name: Checkout certified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.verify.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Plan unpublished versions
        id: plan
        run: node scripts/publish-packages.mjs plan

  publish-api:
    name: Publish extension API
    needs: verify-main
    if: needs.verify-main.outputs.api != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.verify-main.outputs.api) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-main.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: node scripts/publish-packages.mjs stage '${{ matrix.directory }}'
      - run: npm publish
        working-directory: ${{ matrix.directory }}

  publish-extension:
    name: Publish ${{ matrix.package }}
    needs: [verify-main, publish-api]
    if: >-
      always() &&
      needs.verify-main.result == 'success' &&
      (needs.publish-api.result == 'success' || needs.publish-api.result == 'skipped') &&
      needs.verify-main.outputs.extensions != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.verify-main.outputs.extensions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-main.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: node scripts/publish-packages.mjs stage '${{ matrix.directory }}'
      - run: npm publish
        working-directory: ${{ matrix.directory }}
