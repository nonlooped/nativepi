name: Publish extension packages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  verify-main:
    name: Verify main and plan packages
    if: >-
      github.repository == 'nonlooped/nativepi' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      api: ${{ steps.plan.outputs.api }}
      extensions: ${{ steps.plan.outputs.extensions }}
    steps:
      # This step runs before any candidate code is checked out.
      - name: Verify successful main push CI
        id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (repository !== 'nonlooped/nativepi') throw new Error('Publication is restricted to nonlooped/nativepi');
            const trustedRun = (run, sha) =>
              run.head_sha === sha && run.head_branch === 'main' &&
              run.event === 'push' && run.conclusion === 'success' &&
              run.head_repository?.full_name === repository &&
              run.repository?.full_name === repository;
            let sha;
            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              sha = run?.head_sha;
              if (!trustedRun(run, sha)) throw new Error('CI did not certify a push to this repository main');
            } else if (context.eventName === 'workflow_dispatch' && context.ref === 'refs/heads/main') {
              const ref = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
              sha = ref.data.object.sha;
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', status: 'success', per_page: 100,
              });
              if (!runs.some((run) => trustedRun(run, sha))) throw new Error('Main has no successful push CI verdict');
            } else throw new Error('Publication requires a main dispatch or successful main push CI');
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid certified commit SHA');
            core.setOutput('sha', sha);

      - name: Checkout certified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.verify.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.15.0 <25"
          package-manager-cache: false

      - name: Plan unpublished versions
        id: plan
        run: node scripts/publish-packages.mjs plan

  publish-api:
    name: Publish extension API
    needs: verify-main
    if: needs.verify-main.outputs.api != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.verify-main.outputs.api) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-main.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.15.0 <25"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # Node >=24.15 ships npm >=11.12.1, which supports trusted publishing.
      - run: node scripts/publish-packages.mjs stage "$PACKAGE_DIRECTORY"
        env:
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
      - run: npm publish
        working-directory: ${{ matrix.directory }}

  publish-extension:
    name: Publish ${{ matrix.package }}
    needs: [verify-main, publish-api]
    if: >-
      !cancelled() &&
      needs.verify-main.result == 'success' &&
      (needs.publish-api.result == 'success' || needs.publish-api.result == 'skipped') &&
      needs.verify-main.outputs.extensions != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.verify-main.outputs.extensions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-main.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.15.0 <25"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: node scripts/publish-packages.mjs stage "$PACKAGE_DIRECTORY"
        env:
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
      - run: npm publish
        working-directory: ${{ matrix.directory }}
