name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose notes should be regenerated
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Resolve release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Resolve release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $desktopVersion = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          if ($version -ne $desktopVersion) {
            throw "Root version $version does not match desktop version $desktopVersion"
          }

          $tag = "v$version"
          $previousVersion = (git show HEAD^:package.json | ConvertFrom-Json).version
          if ($version -eq $previousVersion) {
            "publish=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if (git ls-remote --exit-code --tags origin "refs/tags/$tag") {
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            if ((git rev-parse "$tag^{commit}") -ne (git rev-parse HEAD)) {
              throw "Tag $tag already points to a different commit"
            }
          }

          $previousTag = ""
          if ($version -notmatch '-') {
            $currentCreatedAt = [datetime](git show -s --format=%cI HEAD)
            $releases = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
            $previousRelease = $releases |
              Where-Object {
                -not $_.draft -and -not $_.prerelease -and
                [datetime]$_.created_at -lt $currentCreatedAt
              } |
              Select-Object -First 1
            if (-not $previousRelease) {
              $previousRelease = $releases |
                Where-Object { [datetime]$_.created_at -lt $currentCreatedAt } |
                Select-Object -Last 1
            }
            $previousTag = $previousRelease.tag_name
          }

          "publish=true" >> $env:GITHUB_OUTPUT
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "previous_tag=$previousTag" >> $env:GITHUB_OUTPUT

  windows-installer:
    name: Build Windows Setup & Publish
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # No code-signing certificate configured; skip auto-discovery
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Setup
        uses: ./.github/actions/setup
        with:
          electron-cache: "true"

      - name: Build Windows installer
        run: bun run dist:win --publish never
        working-directory: apps/desktop

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: nativepi-windows-setup
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

      - name: Prepare release title
        id: release
        shell: pwsh
        run: |
          $version = "${{ needs.release.outputs.tag }}" -replace '^v', ''
          $shortSha = "${{ needs.release.outputs.sha }}".Substring(0, 12)
          "title=NativePi $version ($shortSha)" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          target_commitish: ${{ needs.release.outputs.sha }}
          name: ${{ steps.release.outputs.title }}
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          generate_release_notes: true
          previous_tag: ${{ needs.release.outputs.previous_tag }}
          draft: false
          prerelease: ${{ contains(needs.release.outputs.tag, '-') }}

  repair-release-notes:
    name: Regenerate release notes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          if ($release.draft -or $release.prerelease) {
            throw "$tag is not a published stable release"
          }

          $releases = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          $currentCreatedAt = [datetime]$release.created_at
          $previousRelease = $releases |
            Where-Object {
              -not $_.draft -and -not $_.prerelease -and
              [datetime]$_.created_at -lt $currentCreatedAt
            } |
            Select-Object -First 1
          if (-not $previousRelease) {
            $previousRelease = $releases |
              Where-Object { [datetime]$_.created_at -lt $currentCreatedAt } |
              Select-Object -Last 1
          }
          if (-not $previousRelease) {
            throw "No earlier release exists for $tag"
          }

          $request = @{
            tag_name = $tag
            target_commitish = $release.target_commitish
            previous_tag_name = $previousRelease.tag_name
          } | ConvertTo-Json
          $notes = $request |
            gh api "repos/${{ github.repository }}/releases/generate-notes" --method POST --input - |
            ConvertFrom-Json

          # Patch the body alone. Sending tag_name or target_commitish makes the
          # update endpoint treat the edit as a possible tag write, which the
          # workflow token is never allowed to perform.
          @{ body = $notes.body } |
            ConvertTo-Json |
            gh api "repos/${{ github.repository }}/releases/$($release.id)" --method PATCH --input - > $null
