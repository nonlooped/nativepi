name: Publish extension API

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm trusted publishing; no NPM_TOKEN is used.
  id-token: write

jobs:
  publish:
    name: Publish @nativepi/extension-api
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/extension-api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Resolve published version
        id: resolve
        shell: pwsh
        run: |
          # Ask the registry rather than diffing the previous commit, so the job
          # is idempotent across re-runs, squash merges, and manual dispatch.
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $published = npm view "@nativepi/extension-api@$version" version 2>$null
          if ($LASTEXITCODE -ne 0) { $published = "" }
          if ($published) {
            Write-Host "@nativepi/extension-api@$version is already published"
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Publishing @nativepi/extension-api@$version"
            "publish=true" >> $env:GITHUB_OUTPUT
            "version=$version" >> $env:GITHUB_OUTPUT
          }
          # A missing version makes `npm view` exit 1, and pwsh steps inherit the
          # last native exit code. Without this the step fails on the one path
          # that matters.
          exit 0

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        if: steps.resolve.outputs.publish == 'true'
        run: npm install -g npm@latest

      - name: Publish
        if: steps.resolve.outputs.publish == 'true'
        run: npm publish

      - name: Summary
        if: steps.resolve.outputs.publish == 'true'
        run: echo "Published @nativepi/extension-api@${{ steps.resolve.outputs.version }}" >> $GITHUB_STEP_SUMMARY
