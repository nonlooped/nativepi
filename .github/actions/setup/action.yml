name: Setup
description: Install Bun and project dependencies

inputs:
  bun-cache:
    description: Restore Bun's package cache
    required: false
    default: "false"
  electron-cache:
    description: Cache Electron and electron-builder downloads (only needed for packaging jobs)
    required: false
    default: "false"
  install-filter:
    description: Limit installation to a Bun workspace filter
    required: false
    default: ""

  production:
    description: Install production dependencies only
    required: false
    default: "false"

  install-cpu:
    description: Target CPU for optional native dependencies (host CPU by default)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node for build tools
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ">=24.15.0 <25"
        package-manager-cache: false

    - name: Setup Bun
      id: bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.4.4

    - name: Cache Bun packages
      if: inputs.bun-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-

    - name: Resolve packaging tool versions
      if: inputs.electron-cache == 'true'
      id: packaging-tools
      shell: bash
      run: |
        node --input-type=module -e '
          import { readFileSync, appendFileSync } from "node:fs";
          const lock = readFileSync("bun.lock", "utf8");
          const versions = ["electron", "electron-builder", "builder-util", "dmg-builder"].map(name => {
            const match = lock.match(new RegExp(String.raw`"${name}": \["${name}@([^"]+)"`));
            if (!match) throw new Error(`Missing locked ${name}`);
            return `${name}-${match[1]}`;
          });
          appendFileSync(process.env.GITHUB_OUTPUT, `key=${versions.join("-")}\n`);
        '

    - name: Cache Electron downloads
      if: inputs.electron-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # One list works for every runner OS: actions/cache silently skips
        # whichever paths don't exist on the current platform.
        path: |
          .cache/electron-builder
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
          ~/.cache/electron
          ~/.cache/electron-builder
        key: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.install-cpu }}-packaging-v2-${{ steps.packaging-tools.outputs.key }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.install-cpu }}-packaging-v2-

    - name: Install dependencies
      shell: bash
      env:
        INSTALL_FILTER: ${{ inputs.install-filter }}
        INSTALL_CPU: ${{ inputs.install-cpu }}
        INSTALL_PRODUCTION: ${{ inputs.production }}
      run: |
        args=(--frozen-lockfile)
        if [[ -n "$INSTALL_FILTER" ]]; then args+=(--filter "$INSTALL_FILTER"); fi
        if [[ -n "$INSTALL_CPU" ]]; then args+=(--cpu "$INSTALL_CPU"); fi
        if [[ "$INSTALL_PRODUCTION" = true ]]; then args+=(--production); fi
        bun install "${args[@]}"
