name: Setup
description: Install Bun and project dependencies with caching

inputs:
  electron-cache:
    description: Cache Electron and electron-builder downloads (only needed for packaging jobs)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Cache Bun packages
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    - name: Cache Electron downloads
      if: inputs.electron-cache == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
        key: ${{ runner.os }}-electron-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-electron-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
