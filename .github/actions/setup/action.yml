name: Setup
description: Install Bun and project dependencies

inputs:
  bun-cache:
    description: Restore Bun's package cache
    required: false
    default: "false"
  electron-cache:
    description: Cache Electron and electron-builder downloads (only needed for packaging jobs)
    required: false
    default: "false"
  install-filter:
    description: Limit installation to a Bun workspace filter
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node for build tools
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ">=24.15.0 <25"
        package-manager-cache: false

    - name: Setup Bun
      id: bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.4.4

    - name: Cache Bun packages
      if: inputs.bun-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-

    - name: Cache Electron downloads
      if: inputs.electron-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # One list works for every runner OS: actions/cache silently skips
        # whichever paths don't exist on the current platform.
        path: |
          .cache/electron-builder
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
          ~/.cache/electron
          ~/.cache/electron-builder
        key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-electron-

    - name: Install dependencies
      shell: bash
      env:
        INSTALL_FILTER: ${{ inputs.install-filter }}
      run: |
        if [[ -n "$INSTALL_FILTER" ]]; then
          bun install --frozen-lockfile --filter "$INSTALL_FILTER"
        else
          bun install --frozen-lockfile
        fi
