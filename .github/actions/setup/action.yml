name: Setup
description: Install Bun and project dependencies

inputs:
  bun-cache:
    description: Restore Bun's package cache
    required: false
    default: "false"
  electron-cache:
    description: Cache Electron and electron-builder downloads (only needed for packaging jobs)
    required: false
    default: "false"
  install-filter:
    description: Limit installation to a Bun workspace filter
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Cache Bun packages
      if: inputs.bun-cache == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    - name: Cache Electron downloads
      if: inputs.electron-cache == 'true'
      uses: actions/cache@v6
      with:
        # One list works for every runner OS: actions/cache silently skips
        # whichever paths don't exist on the current platform.
        path: |
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
          ~/.cache/electron
          ~/.cache/electron-builder
        key: ${{ runner.os }}-electron-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-electron-

    - name: Install dependencies
      shell: bash
      env:
        INSTALL_FILTER: ${{ inputs.install-filter }}
      run: |
        if [[ -n "$INSTALL_FILTER" ]]; then
          bun install --frozen-lockfile --filter "$INSTALL_FILTER"
        else
          bun install --frozen-lockfile
        fi
